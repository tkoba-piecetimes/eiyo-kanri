<title>治験栄養管理システム - ログイン</title>
<style>
  :root {
    --bg: #F4F3EF; --surface: #FFFFFF; --surface-2: #EEF3F2; --ink: #16202A; --ink-2: #4A5562; --ink-3: #848D97;
    --line: #E4E2DC; --line-strong: #CFCCC4; --primary: #1D5A6C; --primary-dark: #154655; --primary-soft: #E2EDEF;
    --accent: #6FB7B5; --bad: #AE3A32; --bad-bg: #FBE9E7; --good: #2E7652;
    --focus: 0 0 0 3px rgba(111,183,181,.55);
    --shadow-md: 0 4px 16px -4px rgba(22,32,42,.10), 0 2px 4px rgba(22,32,42,.04);
    --shadow-lg: 0 24px 48px -12px rgba(16,39,47,.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "BIZ UDPGothic", "BIZ UDPゴシック", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    background-color: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.7;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background-image:
      radial-gradient(circle at 50% 42%, transparent 0 180px, rgba(29,90,108,.05) 181px 182px, transparent 183px 280px, rgba(29,90,108,.045) 281px 282px, transparent 283px 400px, rgba(29,90,108,.04) 401px 402px, transparent 403px 540px, rgba(29,90,108,.035) 541px 542px, transparent 543px),
      linear-gradient(rgba(29,90,108,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,90,108,.035) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    background-position: center, center, center;
  }
  .box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-lg); padding: 40px 40px 32px;
    width: 100%; max-width: 480px; animation: gin 260ms ease both;
  }
  @keyframes gin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0;
    background: linear-gradient(160deg, #10272F, #0C1F26); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 32px; height: 32px; }
  h1 { font-size: 1.4rem; font-weight: 700; color: var(--ink); letter-spacing: .02em; line-height: 1.35; }
  .brand small { display: block; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 2px; }
  .sub { color: var(--ink-2); font-size: .94rem; margin: 18px 0 24px; padding-top: 18px; border-top: 1px solid var(--line); }
  label { display: block; font-weight: 700; font-size: .88rem; color: var(--ink-2); margin: 16px 0 6px; letter-spacing: .02em; }
  input[type=text], input[type=password] {
    width: 100%; font-size: 1.1rem; padding: 10px 14px; min-height: 50px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 10px; font-family: inherit;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  input[type=text]:hover, input[type=password]:hover { border-color: var(--ink-3); }
  input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus); }
  .remember { display: flex; align-items: center; gap: 10px; margin: 20px 0 6px; font-size: .94rem; font-weight: 400; color: var(--ink); cursor: pointer; letter-spacing: 0; }
  .remember input { width: 22px; height: 22px; accent-color: var(--primary); }
  button {
    width: 100%; margin-top: 18px; min-height: 52px; font-size: 1.08rem; font-weight: 700;
    background: var(--primary); color: #fff; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
    font-family: inherit; letter-spacing: .08em;
    box-shadow: 0 1px 2px rgba(22,32,42,.05), 0 1px 1px rgba(22,32,42,.03);
    transition: background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
  }
  button:hover { background: var(--primary-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: var(--focus); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .err { display: none; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-bg); border-left: 4px solid var(--bad);
    border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: .94rem; font-weight: 700; }
  .secure { display: flex; align-items: flex-start; gap: 10px; margin-top: 24px; padding: 14px 16px; background: var(--surface-2); border-radius: 12px; font-size: .8rem; color: var(--ink-2); line-height: 1.6; }
  .secure svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--primary); margin-top: 1px; }
  .note { color: var(--ink-3); font-size: .8rem; margin-top: 18px; line-height: 1.7; }
  @media (max-width: 480px) { .box { padding: 28px 22px 24px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const KEYSTORE = "eiyoGateKey_v1";

function b64d(s) {
  const bin = atob(s); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function deriveKey(id, pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(id + ":" + pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(META.salt), iterations: META.iter, hash: "SHA-256" },
    mat, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function tryOpen(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(META.nonce) }, key, b64d(DATA));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
let failCount = 0;
async function submit(ev) {
  ev.preventDefault();
  const btn = document.getElementById("gbtn");
  const err = document.getElementById("gerr");
  err.style.display = "none";
  // 連続失敗時は待ち時間を設ける(この画面だけの簡易な足止め。オフラインでの総当たりは防げないため、
  // 本当の安全性はパスワードの強さとPBKDF2の反復回数に依存する)
  if (failCount >= 3) {
    const wait = Math.min(30, Math.pow(2, failCount - 2));
    btn.disabled = true;
    for (let s = wait; s > 0; s--) {
      btn.textContent = `しばらくお待ちください…(${s})`;
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  btn.disabled = true; btn.textContent = "確認しています…";
  try {
    const key = await deriveKey(document.getElementById("gid").value.trim(), document.getElementById("gpw").value);
    if (document.getElementById("grem").checked) {
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(KEYSTORE, btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    await tryOpen(key);
  } catch (e) {
    failCount++;
    btn.disabled = false; btn.textContent = "開く";
    err.style.display = "block";
    document.getElementById("gpw").value = "";
    document.getElementById("gpw").focus();
  }
}
document.getElementById("f").addEventListener("submit", submit);
// 「記憶する」済みなら自動で開く (認証情報が変わっていたら記憶を消して通常表示)
(async () => {
  const saved = localStorage.getItem(KEYSTORE);
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64d(saved), { name: "AES-GCM" }, true, ["decrypt"]);
    await tryOpen(key);
  } catch (e) { localStorage.removeItem(KEYSTORE); }
})();
