<title>治験栄養管理システム - ログイン</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    background: #f4f1ec; color: #26221e; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    background: #fff; border: 1px solid #e2dcd2; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(60,45,30,.1); padding: 40px 36px;
    width: 100%; max-width: 460px;
  }
  h1 { font-size: 1.3rem; color: #8d4a24; margin-bottom: 6px; letter-spacing: .02em; }
  .sub { color: #5c554d; font-size: .9rem; margin-bottom: 26px; }
  label { display: block; font-weight: 700; font-size: .95rem; color: #5c554d; margin: 14px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; font-size: 1.15rem; padding: 12px 14px; min-height: 52px;
    border: 1.5px solid #c9c0b2; border-radius: 8px; font-family: inherit;
  }
  input:focus { outline: 3px solid #d5a679; border-color: #8d4a24; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 18px 0 6px; font-size: .95rem; cursor: pointer; }
  .remember input { width: 22px; height: 22px; accent-color: #8d4a24; }
  button {
    width: 100%; margin-top: 18px; min-height: 56px; font-size: 1.15rem; font-weight: 700;
    background: #8d4a24; color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit; letter-spacing: .05em;
  }
  button:hover { background: #6f3919; }
  button:disabled { opacity: .5; cursor: wait; }
  .err { display: none; background: #f7e7e6; color: #a92f28; border: 1.5px solid #a92f28;
    border-radius: 8px; padding: 12px 14px; margin-top: 16px; font-size: .95rem; font-weight: 700; }
  .note { color: #8a8178; font-size: .8rem; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <h1>治験栄養管理システム</h1>
  <p class="sub">お渡ししているID・パスワードを入力してください。</p>
  <form id="f">
    <label for="gid">ID</label>
    <input type="text" id="gid" autocomplete="username" autocapitalize="off" autofocus>
    <label for="gpw">パスワード</label>
    <input type="password" id="gpw" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="grem">このパソコンで記憶する（次から入力不要）</label>
    <button id="gbtn" type="submit">開く</button>
  </form>
  <div class="err" id="gerr">IDまたはパスワードが違います。もう一度お試しください。</div>
  <p class="note">このシステムは許可された方のみ利用できます。<br>
  ID・パスワードがわからない場合は、施設のご担当者にお問い合わせください。</p>

const KEYSTORE = "eiyoGateKey_v1";

function b64d(s) {
  const bin = atob(s); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function deriveKey(id, pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(id + ":" + pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(META.salt), iterations: META.iter, hash: "SHA-256" },
    mat, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function tryOpen(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(META.nonce) }, key, b64d(DATA));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function submit(ev) {
  ev.preventDefault();
  const btn = document.getElementById("gbtn");
  const err = document.getElementById("gerr");
  err.style.display = "none";
  btn.disabled = true; btn.textContent = "確認しています…";
  try {
    const key = await deriveKey(document.getElementById("gid").value.trim(), document.getElementById("gpw").value);
    if (document.getElementById("grem").checked) {
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(KEYSTORE, btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    await tryOpen(key);
  } catch (e) {
    btn.disabled = false; btn.textContent = "開く";
    err.style.display = "block";
    document.getElementById("gpw").value = "";
    document.getElementById("gpw").focus();
  }
}
document.getElementById("f").addEventListener("submit", submit);
// 「記憶する」済みなら自動で開く (認証情報が変わっていたら記憶を消して通常表示)
(async () => {
  const saved = localStorage.getItem(KEYSTORE);
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64d(saved), { name: "AES-GCM" }, true, ["decrypt"]);
    await tryOpen(key);
  } catch (e) { localStorage.removeItem(KEYSTORE); }
})();
